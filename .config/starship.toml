add_newline = false

format = """
$hostname\
$sudo\
$docker_context\
$directory\
$git_branch\
$git_commit\
$git_status\
$cmd_duration\
$fill\
${custom.vim_mode}\
$line_break\
$character\
"""

[hostname]
ssh_symbol = " "

[docker_context]
symbol = " "

[directory]
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "..."

[git_branch]
symbol = " "

[fill]
symbol = " "

[custom.vim_mode]
command = "printf '%s' \"$VIM_MODE\""
when = "true"
format = "[$output](blue bold)"
shell = ["bash", "--noprofile", "--norc"]
