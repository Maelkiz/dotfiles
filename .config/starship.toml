palette = "noctalia"
add_newline = false

format = """
$hostname\
$sudo\
$docker_context\
$directory\
$git_branch\
$git_commit\
$git_status\
$cmd_duration\
$fill\
${env_var.VIM_MODE}\
$line_break\
$character\
"""

[hostname]
ssh_symbol = " "

[docker_context]
symbol = " "

[directory]
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "..."

[git_branch]
symbol = " "

[fill]
symbol = " "

[env_var.VIM_MODE]
format = "[$env_value](blue bold)"

