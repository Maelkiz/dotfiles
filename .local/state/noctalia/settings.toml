config_version = 15

[backdrop]
blur_intensity = 0.24999999441206455
enabled = true
tint_intensity = 0.099999997764825821

[bar.default]
background_opacity = 0.9
capsule_group = []
capsule_thickness = 0.74999998696148396
center = [ "workspaces" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "clock" ]
margin_ends = 0
position = "bottom"
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
scale = 1.0500000081956387
smart_auto_hide = true
start = [ "control-center", "launcher", "wallpaper", "clipboard", "session" ]
thickness = 32

[dock]
background_opacity = 0.9

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"

[lockscreen]
blurred_desktop = true
tint_intensity = 0.4999999888241291

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1978.0
    output = "HDMI-A-2"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.9

[osd]
background_opacity = 0.9

[plugins]
enabled = []

[shell]
font_family = "Noto Sans"
niri_overview_type_to_launch_enabled = true
settings_window_translucent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher.providers.session]
    global = true

    [shell.panel]
    transparency_mode = "soft"

    [shell.shadow]
    alpha = 0.4999999888241291

[theme]
builtin = "Tokyo-Night"
community_palette = "Jiva Paper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "discord", "neovim" ]

[wallpaper]
directory = "/home/karl/.config/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/karl/.config/wallpapers/fuji-black-white.png"

    [wallpaper.last]
    path = "/home/karl/.config/wallpapers/fuji-black-white.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/karl/.config/wallpapers/fuji-black-white.png"

[widget.battery]
display_mode = "graphic"
scale = 0.80000000000000004
show_label = false

[widget.brightness]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false